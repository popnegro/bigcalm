name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check MQTT bridge
        run: node --check services/mqtt-bridge/index.mjs
      - name: Check MQTT broker
        run: node --check services/mqtt-broker/index.mjs
      - name: Test MQTT broker
        run: cd services/mqtt-broker && npm install && npm test
